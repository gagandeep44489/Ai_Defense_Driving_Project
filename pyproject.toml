[project]
name = "climateshield-ai-recommendation-engine"
version = "0.1.0"
description = "AI recommendation engine for climate adaptation planning."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "celery>=5.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "slowapi>=0.1",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]
ml = ["scikit-learn>=1.5", "xgboost>=2.0"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
