[project]
name = "sovereignai"
version = "0.1.0"
description = "Indigenous AI-powered cyber threat detection platform for critical infrastructure."
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "redis>=5", "celery>=5.4", "python-jose[cryptography]>=3.3", "passlib[bcrypt]>=1.7", "python-multipart>=0.0.9", "slowapi>=0.1", "prometheus-client>=0.20", "pandas>=2.2", "numpy>=2", "scikit-learn>=1.5", "xgboost>=2", "lightgbm>=4", "catboost>=1.2", "torch>=2.4", "networkx>=3.3", "opencv-python-headless>=4.10", "mlflow>=2.15", "onnx>=1.16", "streamlit>=1.37", "plotly>=5.23"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "black>=24", "isort>=5", "mypy>=1.10", "bandit>=1.7", "pre-commit>=3.7"]
[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.black]
line-length = 100
[tool.isort]
profile = "black"
[tool.pytest.ini_options]
addopts = "--cov=sovereignai --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
[tool.mypy]
python_version = "3.13"
strict = true
