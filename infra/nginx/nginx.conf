events { worker_connections 1024; }
http {
  upstream api { server api:8000; }
  upstream web { server web:3000; }
  server {
    listen 80;
    client_max_body_size 20M;
    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
