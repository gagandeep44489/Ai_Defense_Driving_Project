<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Traffic Flow Predictor</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="card"><h1>Traffic Flow Predictor</h1><form id="f"><input type="date" name="date" required><input type="time" name="time" required><input type="number" name="temperature" step="0.1" placeholder="Temperature" required><input type="number" name="rain" step="0.1" placeholder="Rain" required><input type="number" name="snow" step="0.1" placeholder="Snow" required><select name="weather"><option>Clear</option><option>Clouds</option><option>Rain</option><option>Snow</option><option>Mist</option></select><label><input type="checkbox" name="holiday">Holiday</label><button>Predict</button></form><div id="r"></div></main><script>document.getElementById('f').addEventListener('submit',async(e)=>{e.preventDefault();const fd=new FormData(e.target);const payload={date:fd.get('date'),time:fd.get('time'),temperature:Number(fd.get('temperature')),rain:Number(fd.get('rain')),snow:Number(fd.get('snow')),weather:fd.get('weather'),holiday:fd.get('holiday')==='on'};const res=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();document.getElementById('r').innerText=data.prediction?`Prediction: ${data.prediction} (${data.category})`:data.detail;});</script></body></html>
