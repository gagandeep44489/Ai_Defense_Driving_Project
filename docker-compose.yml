services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: skillgap
      POSTGRES_USER: skillgap
      POSTGRES_PASSWORD: skillgap
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillgap"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env.example
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    volumes: [./apps/api/uploads:/app/uploads]
  worker:
    build: ./apps/api
    command: celery -A app.infrastructure.workers.celery_app.celery_app worker -l info
    env_file: .env.example
    depends_on: [api, redis, postgres]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on: [api]
    ports: ["3000:3000"]
  nginx:
    image: nginx:1.27-alpine
    volumes: [./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [web, api]
    ports: ["8080:80"]
volumes:
  postgres_data:
